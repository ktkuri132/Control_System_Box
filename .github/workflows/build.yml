name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka ordered-set zstandard

    - name: Build with Nuitka
      run: |
        nuitka --standalone --onefile --enable-plugin=pyqt6 --windows-console-mode=disable --output-dir=dist --output-filename=ControlSystemTool.exe --assume-yes-for-downloads --company-name="ControlSystemBox" --product-name="控制系统分析工具" --file-version=2.0.0 --product-version=2.0.0 main.py

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: 控制系统分析工具 ${{ github.ref_name }}
        body: |
          ## 控制系统分析工具 ${{ github.ref_name }}
          
          ### 下载
          - **ControlSystemTool.exe** - Windows 可执行文件（无需安装 Python）
          
          ### 功能特性
          - 📈 实时数据可视化
          - 🔌 串口 + UDP仿真双数据源
          - 🎛️ PID参数调节
          - 📊 性能指标计算
          - 💾 数据导出CSV
        files: dist/ControlSystemTool.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
