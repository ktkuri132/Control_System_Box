name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install MinGW64
      uses: bwoodsend/setup-winlibs-action@v1
      with:
        architecture: 64

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka==2.4 ordered-set zstandard

    - name: Build with Nuitka
      run: |
        python -m nuitka --standalone --onefile --enable-plugin=pyqt6 --windows-console-mode=disable --output-dir=dist --output-filename=ControlSystemTool.exe --assume-yes-for-downloads --mingw64 main.py

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: 控制系统分析工具 ${{ github.ref_name }}
        body: |
          ## 控制系统分析工具 ${{ github.ref_name }}
          
          ### 下载
          - **ControlSystemTool.exe** - Windows 可执行文件（无需安装 Python）
          
          ### 功能特性
          - 📈 实时数据可视化
          - 🔌 串口 + UDP仿真双数据源
          - 🎛️ PID参数调节
          - 📊 性能指标计算
          - 💾 数据导出CSV
        files: dist/ControlSystemTool.exe
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
