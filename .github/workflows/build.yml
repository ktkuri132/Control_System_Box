name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        name: 控制系统分析工具 ${{ github.ref_name }}
        body: |
          ## 控制系统分析工具 ${{ github.ref_name }}
          
          ### 下载
          请从下方 Assets 下载对应版本的安装包。
          
          ### 功能特性
          - 📈 实时数据可视化
          - 🔌 串口 + UDP仿真双数据源
          - 🎛️ PID参数调节
          - 📊 性能指标计算
          - 💾 数据导出CSV
          
          ### 安装说明
          1. 下载 `ControlSystemTool_v2.0.0_Windows_x64.zip`
          2. 解压后直接运行 `ControlSystemTool.exe`
        draft: true
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
